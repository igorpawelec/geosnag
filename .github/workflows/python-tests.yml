# Tests of the pygeosnag package in python/. Runs only when that folder or
# this file changes; the QGIS plugin in qgis/ has its own workflow,
# qgis-tests.yml.
name: python-tests

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python-tests.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python-tests.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]
        # ubuntu-latest is Ubuntu 26.04, for which setup-python has no
        # Python 3.9 build; the 3.9 job stays on 24.04 while requires-python
        # still admits it.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # pygeoadaptels and pygeopalette are not on PyPI, so they come from
        # their repositories first; pip then sees the two dependencies of
        # pyproject as satisfied. pygeoadaptels lives in adaptels/python/ of
        # the geosegments repository, pygeopalette in python/ of geopalette.
        # Everything else ships wheels for all three platforms. python -m
        # pip, so the install lands in the interpreter that runs the tests.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/igorpawelec/geosegments.git#subdirectory=adaptels/python" "git+https://github.com/igorpawelec/geopalette.git#subdirectory=python"
          python -m pip install -e ".[all]"
          python -m pip install pytest pyflakes

      - name: Verify the package imports
        run: python -c "import pygeosnag; print(pygeosnag.__name__, pygeosnag.__version__, pygeosnag.__file__)"

      - name: Lint
        run: python -m pyflakes pygeosnag/ tests/

      - name: Test
        # No models are downloaded: every test fits its own small forest on a
        # synthetic window or needs none.
        run: python -m pytest -v
