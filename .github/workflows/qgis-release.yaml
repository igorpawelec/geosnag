# Build the installable plugin zip on every plugin version tag (qgis-vX.Y.Z)
# and attach it to the release, so an operator downloads one file from
# Releases and installs it.
#
# The build vendors three pure-Python packages: pygeosnag from python/ of the
# tagged commit, and pygeoadaptels and pygeopalette from checkouts *beside*
# this repository, which is why those two are cloned first into the parent
# directory, at their default branches. Pin them here if a release should be
# tied to specific package versions.
name: qgis-release

on:
  push:
    tags:
      - "qgis-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository (the plugin and pygeosnag)
        uses: actions/checkout@v4
        with:
          path: geosnag

      - name: Check out pygeoadaptels (vendored into the zip)
        uses: actions/checkout@v4
        with:
          repository: igorpawelec/pygeoadaptels
          path: pygeoadaptels

      - name: Check out geopalette (pygeopalette is vendored into the zip)
        uses: actions/checkout@v4
        with:
          repository: igorpawelec/geopalette
          path: geopalette

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the zip
        working-directory: geosnag/qgis
        run: python build_zip.py

      - name: Check the zip really carries the vendored packages
        working-directory: geosnag/qgis
        run: |
          python - <<'PY'
          import glob, zipfile
          z = sorted(glob.glob("dist/*.zip"))
          assert z, "no zip was produced"
          names = zipfile.ZipFile(z[-1]).namelist()
          for pkg in ("pygeosnag", "pygeoadaptels", "pygeopalette"):
              assert [n for n in names if f"vendor/{pkg}/__init__.py" in n], f"{pkg} missing from vendor/"
          assert not [n for n in names if n.endswith(".pyc")], "bytecode in zip"
          print(f"{z[-1]}: {len(names)} files, three packages vendored")
          PY

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: geosnag/qgis/dist/*.zip
          generate_release_notes: true
